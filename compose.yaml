name: onboarding-buddy

services:
  web:
    build:
      context: .
    image: onboarding-buddy:latest
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAILS_ENV: production
      RAILS_LOG_LEVEL: "${RAILS_LOG_LEVEL:-info}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}"
      SOLID_QUEUE_IN_PUMA: "true"
      LLM_API_BASE_URL: "${LLM_API_BASE_URL:-http://host.docker.internal:8000}"
    volumes:
      - onboarding_buddy_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  onboarding_buddy_storage:
